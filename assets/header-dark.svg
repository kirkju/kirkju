on-delay:2.520s">e</tspan><tspan class="ch" x="354.8" style="animation-delay:2.565s">d</tspan><tspan class="ch" x="371.6" style="animation-delay:2.655s">A</tspan><tspan class="ch" x="380.0" style="animation-delay:2.700s">I</tspan></text>
  <rect class="caret" x="46" y="142.5" width="2" height="16" rx="1" fill="#22d3ee"/>
  <text class="mono egg" x="44" y="194" font-size="10" fill="#93a4be">psst: there is a note in this README's source</text>

